# Local setup, identical for every member. See infra/README.md.
#   docker compose run --rm certs     # once: local CA and certificate into data/certs/
#   docker compose up -d --build      # start the server on https://site1.test:8443/
#   docker compose run --rm checks    # lint + tests on your working copy, same as CI
#   docker compose run --rm corpus --dry-run   # Track 2b API corpus (see model/README.md)
# Set WH_SOURCE in a .env file next to this one (copy .env.example), e.g. WH_SOURCE=local-c.

services:
  server:
    build: .
    image: whose-human-server
    init: true   # forwards stop signals, so `docker compose down` is immediate
    command: ["--host", "0.0.0.0", "--port", "8443", "--source", "${WH_SOURCE:-}"]
    ports:
      - "127.0.0.1:8443:8443"   # only reachable from this machine
    volumes:
      - ./data:/app/data                 # certs in, logs out
      - ./infra/sites:/app/infra/sites:ro  # edit site content without rebuilding
    restart: unless-stopped

  certs:
    image: whose-human-server
    build: .
    entrypoint: ["python", "-m", "infra.certs"]
    command: []
    volumes:
      - ./data:/app/data
    profiles: ["tools"]

  checks:
    # Lint, format check and tests against your working copy (mounted read-only), same as CI.
    image: whose-human-server
    build: .
    entrypoint: ["sh", "-c"]
    command: ["ruff check --no-cache . && ruff format --no-cache --check . && pytest -q -p no:cacheprovider"]
    volumes:
      - .:/app:ro
    profiles: ["tools"]

  corpus:
    # Track 2b: query model APIs for reference text. Keys come from .env (never committed).
    #   docker compose run --rm corpus --dry-run
    image: whose-human-server
    build: .
    entrypoint: ["python", "-m", "model.api_corpus"]
    command: []
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app:ro
      - ./data:/app/data
    profiles: ["tools"]
