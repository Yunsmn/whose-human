[project]
name = "whose-human"
version = "0.1.0"
description = "Whose Human Are You? Re-identifying Users Behind AI Coding Agents"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["infra/tests", "harness/tests", "model/tests", "linking/tests"]
