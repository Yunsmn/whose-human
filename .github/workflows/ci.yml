name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: No raw logs or real IPs committed
        run: python .github/scripts/check_no_private_data.py

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest -q

      - name: Docker image builds and passes tests
        run: |
          docker compose build
          docker compose run --rm checks
